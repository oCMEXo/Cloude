trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Validate
    displayName: 'Static validation'
    jobs:
      - job: Lint
        displayName: 'Lint and type-check'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'Run ESLint'

          - script: npx tsc --noEmit
            displayName: 'TypeScript type-check'

  - stage: Test
    displayName: 'Unit tests'
    dependsOn: Validate
    jobs:
      - job: Test
        displayName: 'Run Jest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm test
            displayName: 'Run unit tests'
            env:
              JEST_JUNIT_OUTPUT_DIR: '$(Agent.TempDirectory)/test-results'
              JEST_JUNIT_OUTPUT_NAME: 'junit.xml'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)/test-results/junit.xml'
              testRunTitle: 'Jest Tests'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
