trigger:
  branches:
    include:
      - main
      - Create-Azure-Org-with-repos

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Validate
    displayName: 'Static validation'
    jobs:
      - job: Validate_Auth
        displayName: 'service-auth — lint & type-check'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-auth
            displayName: 'Install dependencies'
          - script: npm run lint
            workingDirectory: service-auth
            displayName: 'Run ESLint'
          - script: npx tsc --noEmit
            workingDirectory: service-auth
            displayName: 'TypeScript type-check'

      - job: Validate_Orders
        displayName: 'service-orders — lint & type-check'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-orders
            displayName: 'Install dependencies'
          - script: npm run lint
            workingDirectory: service-orders
            displayName: 'Run ESLint'
          - script: npx tsc --noEmit
            workingDirectory: service-orders
            displayName: 'TypeScript type-check'

      - job: Validate_Notifications
        displayName: 'service-notifications — lint & type-check'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-notifications
            displayName: 'Install dependencies'
          - script: npm run lint
            workingDirectory: service-notifications
            displayName: 'Run ESLint'
          - script: npx tsc --noEmit
            workingDirectory: service-notifications
            displayName: 'TypeScript type-check'

  - stage: Test
    displayName: 'Unit tests'
    dependsOn: Validate
    jobs:
      - job: Test_Auth
        displayName: 'service-auth — Jest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-auth
            displayName: 'Install dependencies'
          - script: npm test
            workingDirectory: service-auth
            displayName: 'Run unit tests'
            env:
              JEST_JUNIT_OUTPUT_DIR: '$(Agent.TempDirectory)/test-results/auth'
              JEST_JUNIT_OUTPUT_NAME: 'junit.xml'
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)/test-results/auth/junit.xml'
              testRunTitle: 'service-auth Tests'
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/service-auth/coverage/cobertura-coverage.xml'

      - job: Test_Orders
        displayName: 'service-orders — Jest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-orders
            displayName: 'Install dependencies'
          - script: npm test
            workingDirectory: service-orders
            displayName: 'Run unit tests'
            env:
              JEST_JUNIT_OUTPUT_DIR: '$(Agent.TempDirectory)/test-results/orders'
              JEST_JUNIT_OUTPUT_NAME: 'junit.xml'
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)/test-results/orders/junit.xml'
              testRunTitle: 'service-orders Tests'
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/service-orders/coverage/cobertura-coverage.xml'

      - job: Test_Notifications
        displayName: 'service-notifications — Jest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            workingDirectory: service-notifications
            displayName: 'Install dependencies'
          - script: npm test
            workingDirectory: service-notifications
            displayName: 'Run unit tests'
            env:
              JEST_JUNIT_OUTPUT_DIR: '$(Agent.TempDirectory)/test-results/notifications'
              JEST_JUNIT_OUTPUT_NAME: 'junit.xml'
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Agent.TempDirectory)/test-results/notifications/junit.xml'
              testRunTitle: 'service-notifications Tests'
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/service-notifications/coverage/cobertura-coverage.xml'
